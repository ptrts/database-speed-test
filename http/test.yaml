# batchInsert: rewriteBatchedInserts vs unnest
- writer:
    threadsNumber: 1
    type: JDBC_REWRITE_BATCHED_INSERTS
    campaignsPerThread: 1
    usersPerCampaign: 100000
    maxBatchSize: 1024
  reader:
    threadsNumber: 0
- writer:
    threadsNumber: 1
    type: JDBC_UNNEST
    campaignsPerThread: 1
    usersPerCampaign: 100000
    maxBatchSize: 1024
  reader:
    threadsNumber: 0

# reading: JDBC vs Spring Data JPA
- writer:
    threadsNumber: 5
    type: JDBC_REWRITE_BATCHED_INSERTS
    campaignsPerThread: 1
    usersPerCampaign: 100000
    maxBatchSize: 1024
  reader:
    threadsNumber: 5
    method: ROW
    implementation: JDBC
- writer:
    threadsNumber: 5
    type: JDBC_REWRITE_BATCHED_INSERTS
    campaignsPerThread: 1
    usersPerCampaign: 100000
    maxBatchSize: 1024
  reader:
    threadsNumber: 5
    method: ROW
    implementation: SPRING_DATA_JPA
